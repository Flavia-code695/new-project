<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Contact Us - Pizza Palace</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- Main content -->
    <main>
      <h1>Contact Us</h1>
      <p>
        We'd love to hear from you! Send us a message or find our contact info
        below.
      </p>

      <div class="contact-form">
        <form action="#" method="post">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>

      <div class="contact-info">
        <h2>Our Contact Info</h2>
        <p><strong>Address:</strong> 123 Pizza Street, Flavor Town</p>
        <p><strong>Phone:</strong> +1 234 567 890</p>
        <p><strong>Email:</strong> contact@pizzapalace.com</p>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Pizza Palace. All rights reserved.</p>
    </footer>
  </body>
</html>
